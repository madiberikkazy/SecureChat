# ========== СЕРВЕР ==========
server.port=${SERVER_PORT:8080}

# ========== ДЕРЕКҚОР ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securechat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:securechat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SecureChat2026!}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ========== JPA ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========== JWT ==========
jwt.secret=${JWT_SECRET:SecureChatJwtSecret2026VeryLongSecretKeyForProduction!}
# 7 күн (миллисекундпен)
jwt.expiration=${JWT_EXPIRATION:604800000}

# ========== ШИФРЛАУ (AES-256-GCM) ==========
# Өндірісте ENCRYPTION_KEY env айнымалысын орнат! (32 байт Base64)
# Генерация: openssl rand -base64 32
app.encryption.key=${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ========== ФАЙЛ ЖҮКТЕУ ==========
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ========== ЛОГТАУ ==========
logging.level.com.securechat=INFO
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN

# ========== СЕРИАЛИЗАЦИЯ ==========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
