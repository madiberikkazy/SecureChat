server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    # DNS resolver — Railway internal network
    resolver 8.8.8.8 ipv6=off valid=10s;

    # React Router — барлық беттерді index.html-ге бағыттау
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api {
        set $backend_upstream http://backend.railway.internal:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy — нақты уақыт хабарламасы үшін
    location /ws {
        set $backend_upstream http://backend.railway.internal:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Жүктелген файлдар (аватарлар)
    location /uploads {
        set $backend_upstream http://backend.railway.internal:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip сығу
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
